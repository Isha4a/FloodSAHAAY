<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify phone — FloodSAHAAY</title>
  <link rel="icon" type="image/png" href="../assets/limitlez-favicon.png">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/premium.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="auth-rebuild">
  <div class="centered-layout">
    <div style="margin-bottom:2rem;text-align:center;">
      <a href="../index.html" class="logo" style="justify-content:center;margin-bottom:1.2rem;"><div class="logo-icon">~</div><span class="brand-mark"><strong>FloodSAHAAY</strong><small>live water intelligence</small></span></a>
      <div class="eyebrow">Verify your signal / 02</div>
    </div>

    <div class="card">
      <div class="eyebrow">Phone verification</div>
      <h2 class="heading-md" style="margin-top:.45rem;margin-bottom:.35rem;">One last signal check.</h2>
      <p class="subtext" style="font-size:.88rem;margin-bottom:1.5rem;">We sent a 6-digit code to <strong id="display-phone">your phone</strong>.</p>
      <div class="setup-progress" aria-label="Registration progress"><span class="active"></span><span class="active"></span><span></span></div>

      <div id="dev-otp-banner" style="display:none;margin-bottom:1rem;padding:.8rem;border:1px solid rgba(244,201,104,.4);border-radius:12px;background:rgba(244,201,104,.14);color:#806421;font-size:.82rem;"></div>
      <div id="error-message" class="error-banner" style="display:none;"></div>

      <form id="otp-form">
        <div class="form-group"><label class="form-label" for="otp">Verification code</label><input type="text" id="otp" class="form-input" placeholder="123456" maxlength="6" inputmode="numeric" autocomplete="one-time-code" style="letter-spacing:.45rem;text-align:center;font-weight:900;font-size:1.35rem;" required></div>
        <button type="submit" id="submit-btn" class="btn tide-button dark btn-full">Verify and continue <span aria-hidden="true">→</span></button>
      </form>
      <p style="margin-top:1.4rem;color:var(--tide-muted);font-size:.76rem;text-align:center;">Your verification code expires shortly.</p>
    </div>
  </div>

  <script src="../js/services/api.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const phone = (sessionStorage.getItem('temp_verify_phone') || '+91 98765 43210').trim();
      const devOtp = sessionStorage.getItem('temp_dev_otp');
      document.getElementById('display-phone').textContent = phone;
      if (devOtp) {
        const banner = document.getElementById('dev-otp-banner');
        banner.textContent = `[Dev Mode] Your OTP code is: ${devOtp}`;
        banner.style.display = 'block';
      }
      document.getElementById('otp-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const otp = document.getElementById('otp').value.trim();
        const errorBanner = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');
        errorBanner.style.display = 'none';
        submitBtn.disabled = true;
        try {
          const response = await AuthService.verifyOtp(phone, otp);
          if (response.success) {
            sessionStorage.removeItem('temp_verify_phone');
            sessionStorage.removeItem('temp_dev_otp');
            window.location.href = 'location-setup.html';
          }
        } catch (error) {
          errorBanner.textContent = error.message || 'Invalid OTP code. Please check your 6-digit code and try again.';
          errorBanner.style.display = 'block';
        } finally {
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
