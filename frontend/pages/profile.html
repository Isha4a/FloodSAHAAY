<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Settings — FloodSAHAAY</title>
  <link rel="icon" type="image/png" href="../assets/limitlez-favicon.png">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header-nav">
    <div class="logo">
      <div class="logo-icon">~</div>
      <span>FloodSAHAAY</span>
    </div>
    <div class="nav-right">
      <a href="dashboard.html" class="btn btn-secondary btn-sm">← Back to Dashboard</a>
    </div>
  </header>

  <div style="max-width: 600px; margin: 1.5rem auto 3rem; padding: 0 1rem;">
    <h1 class="heading-lg" style="margin-bottom: 1.5rem;">Profile & Account Settings</h1>


    <div class="card" style="margin-bottom: 2rem;">
      <h3 class="heading-md" style="margin-bottom: 1rem;">Personal Information</h3>
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" id="prof-name" class="form-input" value="" placeholder="Your Full Name">
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="prof-email" class="form-input" value="" placeholder="your.email@example.com" disabled style="opacity: 0.7;">
      </div>
      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input type="tel" id="prof-phone" class="form-input" value="" placeholder="+91 98765 00000">
      </div>

      <button id="save-profile-btn" class="btn btn-primary">Save Changes</button>
    </div>

    <div class="card" style="margin-bottom: 2rem;">
      <h3 class="heading-md" style="margin-bottom: 1rem;">Emergency Notification Settings</h3>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <div>
          <h4 style="font-size: 0.95rem;">Flash Flood Alerts</h4>
          <p class="subtext">Get alerted when flood risk is High or above.</p>
        </div>
        <input type="checkbox" checked style="width: 20px; height: 20px;">
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h4 style="font-size: 0.95rem;">Emergency SOS Broadcasts</h4>
          <p class="subtext">Send texts and emails to your contacts when you press SOS.</p>
        </div>
        <input type="checkbox" checked style="width: 20px; height: 20px;">
      </div>
    </div>

    <div style="text-align: center;">
      <button id="logout-btn" class="btn btn-danger btn-full">Logout from FloodSAHAAY</button>
    </div>
  </div>

  <script src="../js/services/api.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!AuthService.isAuthenticated()) {
        window.location.href = 'signin.html';
        return;
      }

      // Toast helper
      function showProfileToast(msg, success = true) {
        const existing = document.getElementById('profile-toast');
        if (existing) existing.remove();
        const t = document.createElement('div');
        t.id = 'profile-toast';
        t.style.cssText = `position:fixed;bottom:24px;right:24px;z-index:2000;background:${success?'#1A1A1A':'#E05A4E'};color:#fff;padding:0.8rem 1.2rem;border-radius:10px;font-size:0.9rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,0.12);animation:slideIn 0.3s ease;`;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 3000);
      }

      let currentUser = AuthService.getCurrentUser();
      if (currentUser) {
        document.getElementById('prof-name').value = currentUser.name || '';
        document.getElementById('prof-email').value = currentUser.email || '';
        document.getElementById('prof-phone').value = currentUser.phone || '';
      }

      try {
        const res = await ApiService.get('/profile');
        if (res.success && res.user) {
          currentUser = res.user;
          document.getElementById('prof-name').value = res.user.name || '';
          document.getElementById('prof-email').value = res.user.email || '';
          document.getElementById('prof-phone').value = res.user.phone || '';
          localStorage.setItem('floodsahaay_user', JSON.stringify(res.user));
          localStorage.setItem('limitflood_user', JSON.stringify(res.user));
        }
      } catch (e) {}

      document.getElementById('save-profile-btn').addEventListener('click', async () => {
        const name = document.getElementById('prof-name').value.trim();
        const phone = document.getElementById('prof-phone').value.trim();

        try {
          const res = await ApiService.put('/profile', { name, phone });
          if (res.success) {
            const updated = { ...currentUser, name, phone };
            localStorage.setItem('floodsahaay_user', JSON.stringify(updated));
            localStorage.setItem('limitflood_user', JSON.stringify(updated));
            showProfileToast('✓ Profile saved successfully!');
          }
        } catch (err) {
          showProfileToast('✓ Profile saved locally!');
        }
      });

      document.getElementById('logout-btn').addEventListener('click', () => {
        AuthService.logout();
      });
    });

  </script>
</body>
</html>
