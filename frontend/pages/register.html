<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — FloodSAHAAY</title>
  <link rel="icon" type="image/png" href="../assets/limitlez-favicon.png">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/premium.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="auth-rebuild">
  <div class="centered-layout">
    <div style="margin-bottom:2rem;text-align:center;">
      <a href="../index.html" class="logo" style="justify-content:center;margin-bottom:1.2rem;">
        <div class="logo-icon">~</div><span class="brand-mark"><strong>FloodSAHAAY</strong><small>live water intelligence</small></span>
      </a>
      <div class="eyebrow">Build your safety layer / 01</div>
    </div>

    <div class="card">
      <div class="eyebrow">New operator profile</div>
      <h2 class="heading-md" style="margin-top:.45rem;margin-bottom:.3rem;">Create your account.</h2>
      <p style="color:var(--tide-muted);font-size:.88rem;margin-bottom:1.6rem;">Set up your place, your circle, and your emergency signal.</p>

      <div class="setup-progress" aria-label="Registration progress"><span class="active"></span><span></span><span></span></div>
      <div id="error-message" class="error-banner" style="display:none;"></div>

      <form id="register-form">
        <div class="form-group"><label class="form-label" for="name">Full name</label><input type="text" id="name" class="form-input" placeholder="Alex Johnson" required></div>
        <div class="form-group"><label class="form-label" for="email">Email address</label><input type="email" id="email" class="form-input" placeholder="alex@example.com" required></div>
        <div class="form-group"><label class="form-label" for="phone">Phone number</label><input type="tel" id="phone" class="form-input" placeholder="+91 98765 43210" required></div>
        <div class="form-group"><label class="form-label" for="password">Password</label><input type="password" id="password" class="form-input" placeholder="Choose a strong password" required></div>
        <div class="form-group"><label class="form-label" for="confirmPassword">Confirm password</label><input type="password" id="confirmPassword" class="form-input" placeholder="Repeat your password" required></div>
        <button type="submit" id="submit-btn" class="btn tide-button dark btn-full">Continue to verification <span aria-hidden="true">→</span></button>
      </form>

      <p style="text-align:center;font-size:.82rem;margin-top:1.5rem;color:var(--tide-muted);">Already have an account? <a href="signin.html" style="color:#16896d;font-weight:800;">Sign in</a></p>
    </div>
  </div>

  <script src="../js/services/api.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/pages/register.js"></script>
</body>
</html>
